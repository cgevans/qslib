name: Release

# Keep tag handling separate from branch CI: Forgejo does not support
# combining `branches` and `tags` filters on the same push trigger.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    # Exactly one forge is allowed to respond to a release tag. Change this URL
    # when release ownership moves; mirrors will then skip the entire workflow.
    # Codeberg currently includes a trailing slash in this context; accept
    # either canonical spelling while still rejecting every other forge.
    if: ${{ forge.server_url == 'https://codeberg.org' || forge.server_url == 'https://codeberg.org/' }}
    uses: ./.forgejo/workflows/ci.yml
    secrets: inherit
