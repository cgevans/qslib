name: Release

# Keep tag handling separate from branch CI: Forgejo does not support
# combining `branches` and `tags` filters on the same push trigger.
on:
  push:
    tags:
      - "v*"

permissions:
  # (Text below generated by LLM)
  # A called workflow cannot elevate above its caller's token ceiling. The
  # reusable CI workflow keeps ordinary jobs read-only and grants write only
  # to its Forgejo release job.
  contents: write

jobs:
  release:
    uses: ./.forgejo/workflows/ci.yml
    secrets: inherit
