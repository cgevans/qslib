name: Documentation host

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-host-${{ forge.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: docker
    container:
      image: >-
        code.forgejo.org/oci/node@sha256:7725a5c2c83eed1d36258c66efae14b1ceccd021db9ed1d9559d3335ed3d68ed
      # 22-bookworm, resolved 2026-07-30.
    steps:
      - uses: https://github.com/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: https://github.com/dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07-30

      - uses: https://github.com/astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.17"
          python-version: "3.13"
          enable-cache: false

      - name: Install just
        uses: https://github.com/taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: just@1.50.0

      - name: Build HTML documentation
        run: just docs

      - name: Install SSH client
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openssh-client

      - name: Configure project deployment key
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
          DOCS_DEPLOY_KNOWN_HOSTS: ${{ secrets.DOCS_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DOCS_DEPLOY_KEY" > "$HOME/.ssh/docs_deploy"
          printf '%s\n' "$DOCS_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy atomically to docs.costi.net
        env:
          RELEASE_SHA: ${{ forge.sha }}
          RELEASE_RUN: ${{ forge.run_number }}
          RELEASE_ATTEMPT: ${{ forge.run_attempt }}
          DOCS_DEPLOY_HOST: ${{ secrets.DOCS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          release="${RELEASE_SHA}.${RELEASE_RUN}.${RELEASE_ATTEMPT}"
          tar -C docs/_build/html \
            --exclude=./.doctrees \
            --exclude=./.buildinfo.bak \
            -czf - . |
            ssh -i "$HOME/.ssh/docs_deploy" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "docs-deploy@${DOCS_DEPLOY_HOST}" "deploy ${release}"
