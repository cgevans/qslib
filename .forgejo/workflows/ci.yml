name: CI

# Forgejo Actions CI and release workflow for Codeberg.
#
# Runner expectations (adjust `runs-on:` labels if your runners use different ones):
#   - `docker`            : Linux runner that executes jobs inside a container.
#                           Wheel-build jobs use a manylinux container directly to
#                           avoid docker-in-docker for the maturin step. The
#                           manylinux image has no `node` so a first step installs
#                           Node 20 from NodeSource (Forgejo Actions invokes JS
#                           actions like actions/checkout via node).
#   - `windows`           : Windows host runner (no container). The host PATH
#                           must include `git.exe` and `node.exe`.
#   - `macos-arm64`       : Apple Silicon macOS host runner.
#   - `self-hosted-qpcr`  : optional self-hosted runner with a connection to a
#                           real or simulated QuantStudio machine, for the
#                           integration test jobs. Disable those jobs by
#                           removing them or guarding with `if: false` if no
#                           such runner is registered.
#
# Secrets used (set in Codeberg -> repo -> Settings -> Actions -> Secrets):
#   - CODECOV_TOKEN    : optional; coverage upload is best-effort.
#   - PYPI_TOKEN       : required for `python_release` job on tags.
#   - CRATES_IO_TOKEN  : required for `rust_release` job on tags.
#   - PACKAGE_TOKEN    : required for mirroring release artifacts to Packages.
#   - forge.token      : auto-provided by Forgejo (used for the Forgejo release).
#
# Caching: the Forgejo runner's built-in cache server (used by
# `actions/cache` / Swatinem/rust-cache / setup-uv enable-cache) typically
# isn't reachable from inside the workflow container, so we cache via host
# volumes mounted on the named volumes below. To allow these mounts the
# runner's config.yaml must permit them, e.g.:
#
#   container:
#     valid_volumes:
#       - "qslib-*"
#
# (or `["**"]` to allow any). Volumes persist across runs on the host and
# are shared between jobs.

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - CHANGELOG.md
      - README.md
  pull_request:
  workflow_dispatch:
    inputs:
      build_wheels:
        description: "Build Python wheels and sdists without publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  workflow_call:
    inputs:
      build_wheels:
        description: "Build Python wheels and sdists without publishing"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust_checks:
    name: Rust checks
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy,llvm-tools,rustfmt
      - name: Install just and cargo-llvm-cov
        uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov
      - name: Run clippy
        run: just clippy
      - name: Check Rust formatting
        run: just fmt-rust-check
      - name: Run tests with coverage
        run: just coverage-rust
      - name: Test qs-monitor deployment workflow
        run: sh qs-monitor/tests/deploy.sh
      - name: Validate publishable Rust packages
        run: |
          cargo package --locked -p qslib-core
          cargo package --locked --list -p qslib >/dev/null
          python3 -c '
          import json
          import subprocess

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"]
          ))
          qslib = next(package for package in metadata["packages"] if package["name"] == "qslib")
          core = next(package for package in metadata["packages"] if package["name"] == "qslib-core")
          requirement = next(dep["req"] for dep in qslib["dependencies"] if dep["name"] == "qslib-core")
          expected = "^" + core["version"]
          assert qslib["version"] == core["version"], "qslib and qslib-core versions differ"
          assert requirement == expected, f"qslib-core requirement {requirement!r} != {expected!r}"
          '
          # (Text below generated by LLM)
          # qslib itself can only be fully packaged after this qslib-core
          # version reaches crates.io; the ordered release job does that check.
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: https://github.com/codecov/codecov-action@v5
        with:
          files: coverage-rust.lcov
          name: rust-linux
          token: ${{ secrets.CODECOV_TOKEN }}

  monitor_bundle:
    name: qs-monitor Linux release bundle
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [rust_checks]
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install native build dependencies
        run: apt-get update && apt-get install -y build-essential pkg-config libsqlite3-dev
      - name: Build and validate bundle
        run: |
          set -euo pipefail
          TAG="${{ forge.ref_name }}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(cargo pkgid -p qs-monitor | sed 's/.*#//')
          test "$PACKAGE_VERSION" = "$VERSION"
          cargo build --locked --release -p qs-monitor --target x86_64-unknown-linux-gnu
          BINARY="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/qs-monitor"
          test -x "$BINARY"
          test "$($BINARY --version | awk '{print $2}')" = "$VERSION"
          ASSET="qs-monitor-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p bundle dist
          install -m 0755 "$BINARY" bundle/qs-monitor
          install -m 0644 qs-monitor/packaging/qs-monitor.service bundle/qs-monitor.service
          install -m 0755 qs-monitor/packaging/qs-monitor-deploy bundle/qs-monitor-deploy
          install -m 0644 qs-monitor/INSTALL.md bundle/INSTALL.md
          tar -czf "dist/$ASSET" -C bundle \
            qs-monitor qs-monitor.service qs-monitor-deploy INSTALL.md
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          (cd dist && sha256sum -c "$ASSET.sha256")
          test "$(tar -tzf "dist/$ASSET" | wc -l)" -eq 4
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: qs-monitor-linux-x86_64
          path: dist

  server_bundle:
    name: qslib-server ARMv7 musl release binary
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [rust_checks]
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: armv7-unknown-linux-musleabihf
      - name: Install binary inspection tools
        run: apt-get update && apt-get install -y binutils file
      - name: Build and validate static server binary
        run: |
          set -euo pipefail
          TAG="${{ forge.ref_name }}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(cargo pkgid -p qslib-server | sed 's/.*#//')
          test "$PACKAGE_VERSION" = "$VERSION"

          TARGET=armv7-unknown-linux-musleabihf
          cargo build --locked -p qslib-server --target "$TARGET" --profile min-size
          BINARY="$CARGO_TARGET_DIR/$TARGET/min-size/qslib-server"
          test -x "$BINARY"

          FILE_INFO=$(file -b "$BINARY")
          echo "$FILE_INFO"
          case "$FILE_INFO" in
            *"ELF 32-bit"*"ARM"*"statically linked"*) ;;
            *) echo "unexpected qslib-server binary: $FILE_INFO" >&2; exit 1 ;;
          esac
          if readelf -lW "$BINARY" | grep -q INTERP; then
            echo "qslib-server unexpectedly has a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -dW "$BINARY" 2>/dev/null | grep -q NEEDED; then
            echo "qslib-server unexpectedly has dynamic dependencies" >&2
            exit 1
          fi

          ASSET="qslib-server-${TAG}-${TARGET}"
          mkdir -p dist
          install -m 0755 "$BINARY" "dist/$ASSET"
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          (cd dist && sha256sum -c "$ASSET.sha256")
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: qslib-server-armv7-musl
          path: dist

  server_host_binary:
    name: qslib-server x86-64 musl binary
    needs: [rust_checks]
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: Install binary inspection tools
        run: apt-get update && apt-get install -y binutils file
      - name: Build and validate static server binary
        run: |
          set -euo pipefail
          TARGET=x86_64-unknown-linux-musl
          cargo build --locked -p qslib-server --target "$TARGET" --profile min-size
          BINARY="$CARGO_TARGET_DIR/$TARGET/min-size/qslib-server"
          test -x "$BINARY"

          FILE_INFO=$(file -b "$BINARY")
          echo "$FILE_INFO"
          case "$FILE_INFO" in
            *"ELF 64-bit"*"x86-64"*"static-pie linked"*) ;;
            *"ELF 64-bit"*"x86-64"*"statically linked"*) ;;
            *) echo "unexpected qslib-server binary: $FILE_INFO" >&2; exit 1 ;;
          esac
          if readelf -lW "$BINARY" | grep -q INTERP; then
            echo "qslib-server unexpectedly has a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -dW "$BINARY" 2>/dev/null | grep -q NEEDED; then
            echo "qslib-server unexpectedly has dynamic dependencies" >&2
            exit 1
          fi

          mkdir -p dist-host
          install -m 0755 "$BINARY" dist-host/qslib-server
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: qslib-server-x86_64-musl
          path: dist-host

  python_checks:
    name: Python checks
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
        - qslib-uv:/cache/uv
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
      UV_CACHE_DIR: /cache/uv
      # Fail rather than skip if the qslib-server binary is missing, so the
      # end-to-end HTTP tests cannot go quiet.
      QSLIB_REQUIRE_SERVER_BINARY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools
      - name: Install uv
        # Cache lives on the host volume mounted at $UV_CACHE_DIR; we don't
        # use setup-uv's enable-cache (which talks to the runner cache server).
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Install just and cargo-llvm-cov
        uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov
      - name: Setup locked virtual environment
        run: |
          uv venv
          uv sync --locked --group dev --no-install-project
      - name: Validate Python package version against release tag
        if: startsWith(forge.ref, 'refs/tags/')
        run: |
          TAG="${{ forge.ref_name }}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(cargo pkgid -p qslib | sed 's/.*#//')
          test "$PACKAGE_VERSION" = "$VERSION"
          test "$(grep -c "^## Version ${VERSION}$" CHANGELOG.md)" -eq 1
      - name: Run ruff
        run: just ruff
      - name: Check Python formatting
        run: just fmt-http-check
      - name: Type-check HTTP client and dispatch
        run: just typecheck-http
      - name: Rust coverage from Python tests
        run: just coverage-rust-from-python
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: https://github.com/codecov/codecov-action@v5
        with:
          files: coverage-rust-from-python.lcov
          name: rust-from-python-linux
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Docs build
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
        - qslib-uv:/cache/uv
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
      UV_CACHE_DIR: /cache/uv
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Install just
        uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: just
      - name: Build documentation
        run: just docs
      - name: Deploy to Codeberg Pages
        if: ${{ forge.event_name == 'push' && forge.ref == 'refs/heads/main' }}
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://cge.codeberg.page/qslib/
          token: ${{ forge.token }}
          source: docs/_build/html/

  linux:
    name: Python Linux builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [python_checks]
    runs-on: docker
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - name: Install Node.js (manylinux image has no node, but JS actions need it)
        run: |
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Build wheels
        run: |
          PYTHONS="/opt/python/cp310-cp310/bin/python3 \
                   /opt/python/cp311-cp311/bin/python3 \
                   /opt/python/cp312-cp312/bin/python3 \
                   /opt/python/cp313-cp313/bin/python3 \
                   /opt/python/cp314-cp314/bin/python3"
          /opt/python/cp312-cp312/bin/pip install maturin
          /opt/python/cp312-cp312/bin/maturin build --release --out dist \
            --manylinux 2_28 --target ${{ matrix.target }}-unknown-linux-gnu \
            -i $PYTHONS
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  linux-freethreaded:
    name: Python Linux free-threaded builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [python_checks]
    runs-on: docker
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    strategy:
      matrix:
        target: [x86_64]
        python-version: ['3.13t', '3.14t']
    steps:
      - name: Install Node.js (manylinux image has no node, but JS actions need it)
        run: |
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Compute interpreter path
        id: interp
        run: |
          VER="${{ matrix.python-version }}"
          MM=$(echo "$VER" | tr -d '.t')
          echo "path=/opt/python/cp${MM}-cp${MM}t/bin/python3" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        run: |
          /opt/python/cp312-cp312/bin/pip install maturin
          /opt/python/cp312-cp312/bin/maturin build --release --out dist \
            --interpreter ${{ steps.interp.outputs.path }} \
            --manylinux 2_28 --target ${{ matrix.target }}-unknown-linux-gnu \
            --no-default-features --features python
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-linux-freethreaded-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist

  windows:
    name: Python Windows builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [python_checks]
    runs-on: windows
    env:
      UV_CACHE_DIR: .uv-cache
      UV_MANAGED_PYTHON: "1"
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: pwsh
        run: |
          $rustup = Join-Path ([System.IO.Path]::GetTempPath()) "rustup-init.exe"
          Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $rustup
          & $rustup --default-toolchain stable --profile minimal --no-modify-path -y
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Install Python interpreters
        shell: pwsh
        run: uv python install 3.10 3.11 3.12 3.13 3.14
      - name: Build wheels
        shell: pwsh
        run: |
          $pythons = @("3.10", "3.11", "3.12", "3.13", "3.14") | ForEach-Object { uv python find $_ }
          uvx maturin build --release --out dist --interpreter $pythons
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  windows-freethreaded:
    name: Python Windows free-threaded builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [python_checks]
    runs-on: windows
    env:
      UV_CACHE_DIR: .uv-cache
      UV_MANAGED_PYTHON: "1"
    strategy:
      matrix:
        target: [x64]
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: pwsh
        run: |
          $rustup = Join-Path ([System.IO.Path]::GetTempPath()) "rustup-init.exe"
          Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $rustup
          & $rustup --default-toolchain stable --profile minimal --no-modify-path -y
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Install Python interpreter
        shell: pwsh
        run: uv python install ${{ matrix.python-version }}
      - name: Build wheels
        shell: pwsh
        run: |
          $python = uv python find ${{ matrix.python-version }}
          uvx maturin build --release --out dist --interpreter $python --no-default-features --features python
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-windows-freethreaded-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist

  # macOS jobs run on the `macos-arm64` runner. Intel macOS wheels are intentionally deprecated.
  #
  # These use uv-managed Python (like the Windows jobs) rather than
  # actions/setup-python. On the host-mode macOS runner setup-python installs
  # the interpreter with `sudo installer -pkg`, but the unprivileged runner
  # user can neither sudo nor write setup-python's default /Users/runner
  # tool-cache path. uv fetches a standalone interpreter into the user's own
  # directory with no sudo and no tool cache.
  macos:
    name: Python macOS builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [python_checks]
    runs-on: macos-arm64
    env:
      UV_MANAGED_PYTHON: "1"
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python
        run: uv python install 3.10
      - name: Build wheels
        # abi3 (default features) builds a single cp310-abi3 wheel from 3.10.
        run: |
          python="$(uv python find 3.10)"
          uvx maturin build --release --out dist --interpreter "$python"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  macos-freethreaded:
    name: Python macOS free-threaded builds
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [python_checks]
    runs-on: macos-arm64
    env:
      UV_MANAGED_PYTHON: "1"
    strategy:
      matrix:
        target: [aarch64]
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Build wheels
        run: |
          python="$(uv python find ${{ matrix.python-version }})"
          uvx maturin build --release --out dist --interpreter "$python" --no-default-features --features python
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-macos-freethreaded-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Build sdist
    if: startsWith(forge.ref, 'refs/tags/') || inputs.build_wheels == 'true'
    needs: [python_checks]
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install maturin
      - name: Build sdist
        run: maturin sdist --out dist
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  registry_preflight:
    name: Release registry preflight
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [rust_checks, linux, linux-freethreaded, windows, windows-freethreaded, macos, macos-freethreaded, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Reject registry collisions while allowing exact partial retries
        run: |
          set -euo pipefail

          TAG="${{ forge.ref_name }}"
          VERSION="${TAG#v}"
          CORE_VERSION=$(cargo pkgid -p qslib-core | sed 's/.*#//')
          QSLIB_VERSION=$(cargo pkgid -p qslib | sed 's/.*#//')
          test "$CORE_VERSION" = "$VERSION"
          test "$QSLIB_VERSION" = "$VERSION"

          PYPI_RESPONSE=/tmp/qslib-pypi-version.json
          PYPI_STATUS=$(curl --retry 3 --retry-all-errors --silent --show-error \
            --output "$PYPI_RESPONSE" --write-out '%{http_code}' \
            "https://pypi.org/pypi/qslib/${VERSION}/json")
          case "$PYPI_STATUS" in
            404)
              echo "qslib $VERSION is available on PyPI"
              ;;
            200)
              python3 - "$PYPI_RESPONSE" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          response = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path("dist").iterdir()
              if path.is_file()
          }
          if not expected:
              raise SystemExit("release preflight did not download any Python distributions")
          published = {item["filename"]: item["digests"]["sha256"] for item in response["urls"]}
          unexpected = sorted(published.keys() - expected.keys())
          if unexpected:
              raise SystemExit(f"PyPI has unexpected files for this version: {', '.join(unexpected)}")
          matching = expected.keys() & published.keys()
          if not matching:
              raise SystemExit("PyPI already has this version, but none of its files match this release")
          conflicts = sorted(name for name in matching if expected[name] != published[name])
          if conflicts:
              raise SystemExit(f"PyPI has conflicting files for this version: {', '.join(conflicts)}")
          print(f"PyPI partial retry verified: {len(matching)} existing file(s) match exactly")
          PY
              ;;
            *)
              echo "Unable to verify qslib $VERSION on PyPI (HTTP $PYPI_STATUS)" >&2
              exit 1
              ;;
          esac

          crate_matches_release() {
            CRATE="$1"
            CRATE_VERSION="$2"
            RESPONSE="/tmp/${CRATE}-crates-io-version.json"
            STATUS=$(curl --retry 3 --retry-all-errors --silent --show-error \
              --user-agent 'qslib-release-ci/1.0 (qslib@mb.costi.net)' \
              --output "$RESPONSE" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${CRATE}/${CRATE_VERSION}")
            case "$STATUS" in
              404) return 1 ;;
              200) ;;
              *)
                echo "Unable to verify ${CRATE}@${CRATE_VERSION} on crates.io (HTTP $STATUS)" >&2
                exit 1
                ;;
            esac

            PUBLISHED_CHECKSUM=$(python3 -c \
              'import json, sys; print(json.load(open(sys.argv[1]))["version"]["checksum"])' \
              "$RESPONSE")
            cargo package --locked --no-verify -p "$CRATE" >/dev/null
            PACKAGE="$CARGO_TARGET_DIR/package/${CRATE}-${CRATE_VERSION}.crate"
            LOCAL_CHECKSUM=$(sha256sum "$PACKAGE" | awk '{print $1}')
            if [ "$LOCAL_CHECKSUM" != "$PUBLISHED_CHECKSUM" ]; then
              echo "crates.io has a conflicting ${CRATE}@${CRATE_VERSION}" >&2
              exit 1
            fi
            echo "crates.io partial retry verified: ${CRATE}@${CRATE_VERSION} matches exactly"
            return 0
          }

          if ! crate_matches_release qslib-core "$CORE_VERSION"; then
            echo "qslib-core@$CORE_VERSION is available on crates.io"
          fi
          if ! crate_matches_release qslib "$QSLIB_VERSION"; then
            echo "qslib@$QSLIB_VERSION is available on crates.io"
          fi

  python_release:
    name: Python PyPI release
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [registry_preflight]
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7
      - name: Publish to PyPI
        # PyPI trusted publishing currently doesn't support Codeberg/Forgejo
        # OIDC, so we use an API token. Set PYPI_TOKEN as a repo secret.
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  rust_release:
    name: Rust crates.io release
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
      volumes:
        - qslib-cargo:/cache/cargo
        - qslib-cargo-target:/cache/cargo-target
    env:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/cargo-target
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [registry_preflight]
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ forge.ref_name }}"
          TAG_VERSION="${TAG#v}"
          CORE_VERSION=$(cargo pkgid -p qslib-core | sed 's/.*#//')
          QSLIB_VERSION=$(cargo pkgid -p qslib | sed 's/.*#//')
          test "$CORE_VERSION" = "$QSLIB_VERSION"
          test "$QSLIB_VERSION" = "$TAG_VERSION"

          crate_is_published() {
            cargo info --registry crates-io "$1@$2" >/dev/null 2>&1
          }

          if crate_is_published qslib "$QSLIB_VERSION"; then
            echo "qslib@$QSLIB_VERSION was already published and matched during preflight"
            exit 0
          fi

          if crate_is_published qslib-core "$CORE_VERSION"; then
            echo "qslib-core@$CORE_VERSION is already published"
          else
            cargo publish --locked -p qslib-core
          fi

          for ATTEMPT in $(seq 1 30); do
            if crate_is_published qslib-core "$CORE_VERSION"; then
              break
            fi
            if [ "$ATTEMPT" -eq 30 ]; then
              echo "qslib-core@$CORE_VERSION did not propagate to crates.io" >&2
              exit 1
            fi
            echo "Waiting for qslib-core@$CORE_VERSION to propagate ($ATTEMPT/30)"
            sleep 10
          done

          cargo publish --locked -p qslib

  forgejo_release:
    name: Forgejo release
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [linux, linux-freethreaded, windows, windows-freethreaded, macos, macos-freethreaded, sdist, monitor_bundle, server_bundle, python_release, rust_release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: qs-monitor-linux-x86_64
          path: dist
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: qslib-server-armv7-musl
          path: dist
      - name: Extract changelog for this version
        run: |
          TAG="${{ forge.ref_name }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## Version / {
              if (found) exit
              header=$0; sub(/^## Version /, "", header)
              if (header == ver) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "CHANGELOG.md has no release notes for Version $VERSION" >&2
            exit 1
          fi
      - name: Create Forgejo release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ forge.server_url }}
          repo: ${{ forge.repository }}
          tag: ${{ forge.ref_name }}
          title: ${{ forge.ref_name }}
          release-notes-file: /tmp/release-notes.md
          release-dir: dist
          token: ${{ forge.token }}

  package_release:
    name: Codeberg Packages release mirror
    runs-on: docker
    container:
      image: docker.io/catthehacker/ubuntu:act-22.04
    if: startsWith(forge.ref, 'refs/tags/')
    needs: [linux, linux-freethreaded, windows, windows-freethreaded, macos, macos-freethreaded, sdist, monitor_bundle, server_bundle, python_release, rust_release]
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: qs-monitor-linux-x86_64
          path: dist
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: qslib-server-armv7-musl
          path: dist
      - name: Upload release files to Generic Packages
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          OWNER: ${{ forge.repository_owner }}
          VERSION: ${{ forge.ref_name }}
          SERVER_URL: ${{ forge.server_url }}
        run: |
          set -euo pipefail
          for file in dist/*; do
            curl --fail --header "Authorization: token ${TOKEN}" \
              --upload-file "$file" \
              "${SERVER_URL}/api/packages/${OWNER}/generic/qslib-dist/${VERSION}/$(basename "$file")"
          done

  python_tests_real:
    name: Python tests with machine
    # Optional: requires a self-hosted runner with the `self-hosted-qpcr` label
    # connected
    runs-on: self-hosted-qpcr
    needs: [server_host_binary]
    env:
      QSLIB_TEST_MACHINE: qpcr-fwd
      QSLIB_TEST_PORT: "7000"
      QSLIB_TEST_SSL_PORT: "7443"
      QSLIB_TEST_PASSWORD: correctpassword
      QSLIB_TEST_SSL: "false"
      QSLIB_TEST_SERVER_PORT: "7500"
      QSLIB_TEST_SERVER_BINARY: server-binary/qslib-server
      QSLIB_TEST_SERVER_TOKEN: ${{ secrets.QSLIB_TEST_SERVER_TOKEN }}
      QSLIB_TEST_SERVER_SCPI_TARGET: 127.0.0.1:7001
      QSLIB_REQUIRE_SERVER_BINARY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install just and cargo-llvm-cov
        uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov
      - name: Fetch qslib-server binary to deploy
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: qslib-server-x86_64-musl
          path: server-binary
      - name: Make the server binary executable
        run: chmod 0755 server-binary/qslib-server
      - name: Setup virtual environment
        run: |
          uv venv -p 3.13
          uv pip install maturin
          uv sync --locked --group dev --no-install-project
      - name: Run pytest with Python + Rust coverage
        run: just coverage-python-full
      - name: Retrieve qslib-server log
        if: failure()
        continue-on-error: true
        run: |
          uv run python - <<'PY' > qslib-server.log
          import os
          from qslib import AccessLevel, Machine

          m = Machine(
              os.environ["QSLIB_TEST_MACHINE"],
              port=int(os.environ["QSLIB_TEST_PORT"]),
              password=os.environ["QSLIB_TEST_PASSWORD"],
              ssl=False,
          )
          log = os.environ.get("QSLIB_TEST_SERVER_LOG", "/data/qslib-server.log")
          with m:
              with m.at_access(AccessLevel.Controller):
                  print(m.run_command(f'SYST:EXEC "cat {log}"'))
          PY
      - name: Upload qslib-server log
        if: failure()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: qslib-server-log
          path: qslib-server.log
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: https://github.com/codecov/codecov-action@v5
        with:
          files: coverage-python.xml,coverage-rust-from-python.lcov
          name: python-self-hosted
          token: ${{ secrets.CODECOV_TOKEN }}

  rust_integration_tests:
    name: Rust tests with machine
    runs-on: self-hosted-qpcr
    env:
      QSLIB_TEST_MACHINE: qpcr-fwd
      QSLIB_TEST_PORT: "7000"
      QSLIB_TEST_SSL_PORT: "7443"
      QSLIB_TEST_PASSWORD: correctpassword
      QSLIB_TEST_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools
      - name: Install just and cargo-llvm-cov
        uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov
      - name: Run integration tests with coverage
        run: just cov-rust-integration
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: https://github.com/codecov/codecov-action@v5
        with:
          files: coverage-integration.lcov
          name: rust-integration
          token: ${{ secrets.CODECOV_TOKEN }}
