[package]
name = "qslib-server"
version.workspace = true
edition = "2021"
description = "On-instrument HTTP transport/command agent for QuantStudio machines (bulk file transfer, one-shot SCPI, SCPI tunnel)"
license = "EUPL-1.2"
authors = ["Constantine Evans <qslib@mb.costi.net>"]
homepage = "https://codeberg.org/cge/qslib"
repository = "https://codeberg.org/cge/qslib"

[[bin]]
name = "qslib-server"
path = "src/main.rs"

[dependencies]
# Core SCPI protocol/connection layer, no TLS and no pyo3 — keeps the agent a
# pure-Rust static binary that cross-compiles to armv7 musl with no C deps.
qslib-core = { path = "../qslib-core", default-features = false }

tokio = { version = "1.42", features = ["rt-multi-thread", "net", "io-util", "macros", "fs", "time", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
httpdate = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "matched-path"] }
tower = { version = "0.5", default-features = false }
http = "1"
http-body-util = "0.1"
bytes = "1"
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4", features = ["derive", "std", "env", "help", "usage", "error-context"], default-features = false }
anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
