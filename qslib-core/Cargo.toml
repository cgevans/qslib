[package]
name = "qslib-core"
version.workspace = true
edition = "2021"
description = "Core SCPI protocol and connection layer for QSlib (QuantStudio qPCR machines)"
license = "EUPL-1.2"
authors = ["Constantine Evans <qslib@mb.costi.net>"]
homepage = "https://codeberg.org/cge/qslib"
repository = "https://codeberg.org/cge/qslib"

[lib]
name = "qslib_core"

[dependencies]
anyhow = "1.0.95"
bstr = "1.11.3"
dashmap = "6.1"
data-encoding = "2.7.0"
digest = { version = "0.10.7", default-features = false }
hex = "0.4"
hmac = "0.12"
indexmap = "2.7"
lazy_static = "1.5.0"
log = "0.4.25"
md-5 = "0.10"
regex = "1.11.1"
shell-words = "1"
thiserror = "2.0.9"
tokio = { version = "1.42.0", features = ["net", "sync", "rt", "rt-multi-thread", "io-util", "macros", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
winnow = "0.7"

# Optional: SIMD-accelerated message framing
memchr = { version = "2.7", optional = true }

# Optional: Python bindings (pyclass annotations on core types). extension-module/abi3
# come from the depending `qslib` crate; core only needs the derives.
pyo3 = { version = "0.26", optional = true, features = ["anyhow", "multiple-pymethods"] }

# Optional: TLS client (rustls/ring). Off by default so the agent cross-compiles
# to static musl without C/crypto deps.
rustls = { version = "0.23.20", features = ["ring"], default-features = false, optional = true }
rustls-pki-types = { version = "1.10.1", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
tokio-rustls = { version = "0.26.1", features = ["ring", "logging", "tls12"], default-features = false, optional = true }
webpki = { package = "rustls-webpki", version = "0.103", optional = true }

[features]
default = []
debug = ["winnow/debug"]
python = ["dep:pyo3"]
simd = ["dep:memchr", "winnow/simd"]
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:rustls-pemfile", "dep:tokio-rustls", "dep:webpki"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
