[workspace]
members = [".", "qs-monitor", "qslib-core", "qslib-server"]
resolver = "2"

[workspace.package]
version = "0.16.0"

# Size-optimized profile for the cross-compiled qslib-server binary. Applied only when
# built with `--profile min-size` (e.g. the armv7 musl qslib-server build), so the
# normal `release` profile for qslib/qs-monitor is unaffected.
#
# Keeps `panic = "unwind"` (the default) rather than "abort": qslib-server runs as
# root on a hard-to-update fleet, so a stray panic should drop one connection,
# not the whole server. The extra unwind tables cost a few hundred KB.
[profile.min-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package]
name = "qslib"
version.workspace = true
edition = "2021"
description = "QSlib QuantStudio qPCR machine library"
license = "EUPL-1.2"
authors = ["Constantine Evans <qslib@mb.costi.net>"]
homepage = "https://codeberg.org/cge/qslib"
repository = "https://codeberg.org/cge/qslib"
# (Text below generated by LLM)
# Keep the crates.io archive limited to the Rust crate.  This repository also
# contains the Python package, Sphinx documentation, server/monitor workspace
# members, and local release tooling; none of those are inputs to this crate.
# The EDS fixtures below are required by the Rust unit tests.  The much larger
# optional LFS fixture (tiff-collection.eds) is deliberately not included.
include = [
    "/src/*.rs",
    "/src/analysis_protocol.xml.zz",
    "/tests/*.rs",
    "/tests/*.eds",
    "/tests/*.eds.license",
    "/benches/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/AUTHORS.md",
    "/CITATION.cff",
    "/LICENSE.txt",
    "/LICENSES/EUPL-1.2.txt",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "qslib"
crate-type = ["cdylib", "rlib"]

[dependencies]
qslib-core = { path = "qslib-core", version = "0.16.0", default-features = false, features = ["tls"] }
dashmap = "6.1"
# HTTP client for the on-instrument qslib-server (server_client). Plain HTTP only
# (qslib-server has no TLS), so no TLS backend is pulled in.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
enum_dispatch = "0.3.13"
futures = "0.3.31"
indexmap = "2.7"
log = "0.4.25"
pyo3 = { version = "0.26", optional = true, features = ["extension-module", "anyhow", "multiple-pymethods"] }
quick-xml = { version = "0.38", features = ["overlapped-lists", "serialize"] }
regex = "1.11.1"
rustls = { version = "0.23.20", features = ["ring"], default-features = false }
rustls-pki-types = "1.10.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.9"
tokio = { version = "1.42.0", features = ["net", "sync", "rt", "rt-multi-thread", "io-util", "macros"] }
tokio-rustls = { version = "0.26.1", features = ["ring", "logging", "tls12"], default-features = false }
tokio-stream = { version = "0.1.17", features = ["sync"] }
uuid = { version = "1.12.1", features = ["v4"] }
winnow = "0.7"
zip = "2"
memchr = { version = "2.7", optional = true }
lazy_static = "1.5.0"
data-encoding = "2.7.0"
anyhow = "1.0.95"
bstr = "1.11.3"
bytes = "1"
tracing = "0.1.41"
polars = { version = "^0.52", features = ["lazy", "diagonal_concat", "timezones"] }
pyo3-polars = { version = "^0.25", optional = true }
numpy = { version = "0.26", optional = true }
tiff = "0.11"
once_cell = "1.21.3"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
digest = { version = "0.10.7", default-features = false }
rustls-pemfile = "2.2.0"
webpki = { package = "rustls-webpki", version = "0.103" }
shell-words = "1"
tempfile = "3"
serde_json = "1"
flate2 = "1"

[features]
default = ["abi3"]
debug = ["winnow/debug", "qslib-core/debug"]
python = ["pyo3", "pyo3-polars", "numpy", "qslib-core/python"]
abi3 = ["pyo3/abi3-py310"]
simd = ["dep:memchr", "winnow/simd", "qslib-core/simd"]

[dev-dependencies]
env_logger = "0.11.6"
rcgen = "0.13.2"
rustls-pemfile = "2.2.0"
criterion = { version = "0.5", features = ["html_reports"] }
base64 = "0.21"
# default = ["python"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[[bench]]
name = "msg_recv"
harness = false

[[bench]]
name = "message_parsing"
harness = false
