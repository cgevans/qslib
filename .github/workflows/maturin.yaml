name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
    paths-ignore:
      - CHANGELOG.md
      - README.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust_checks:
    name: Checks for Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy,llvm-tools
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Run Clippy
        run: just clippy
      - name: Run tests and coverage
        run: just coverage-rust
      - uses: codecov/codecov-action@v5
        with:
          files: coverage-rust.lcov
          name: rust-linux
          token: ${{ secrets.CODECOV_TOKEN }}

  python_checks:
    name: Checks for Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Run Ruff
        run: just ruff
      - name: Setup virtual environment
        run: |
          uv venv
          uv sync --group dev --no-install-project
      - name: Rust coverage from Python tests
        run: just coverage-rust-from-python
      - uses: codecov/codecov-action@v5
        with:
          files: coverage-rust-from-python.lcov
          name: rust-from-python-linux
          token: ${{ secrets.CODECOV_TOKEN }}

  linux:
    name: Python Linux builds
    needs: [python_checks]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Setup test environment
        env:
          RUSTC_WRAPPER: ""
        run: |
          uv venv
          uv sync --group dev --no-install-project
          uv pip install --force-reinstall dist/qslib-*.whl
      - name: pytest
        run: just ci-test-python
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          name: python-linux-${{ matrix.target }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Trigger RTDs build
        uses: dfm/rtds-action@v1
        with:
          webhook_url: ${{ secrets.RTDS_WEBHOOK_URL }}
          webhook_token: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          commit_ref: ${{ github.ref }}

  linux-freethreaded:
    name: Python Linux free-threaded builds
    needs: [python_checks]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64]
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - name: Compute container interpreter path
        id: interp
        run: |
          VER="${{ matrix.python-version }}"
          MM=$(echo "$VER" | tr -d '.t')
          echo "path=/opt/python/cp${MM}-cp${MM}t/bin/python3" >> "$GITHUB_OUTPUT"
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.interp.outputs.path }} --no-default-features --features python
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-freethreaded-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist

  windows:
    name: Python Windows builds
    needs: [python_checks]
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          architecture: ${{ matrix.target }}
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Setup test environment
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          uv venv
          uv sync --group dev --no-install-project
          uv pip install --force-reinstall dist/qslib-*.whl
      - name: pytest
        shell: bash
        run: just ci-test-python
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          name: python-windows-${{ matrix.target }}
          token: ${{ secrets.CODECOV_TOKEN }}

  windows-freethreaded:
    name: Python Windows free-threaded builds
    needs: [python_checks]
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python3 --no-default-features --features python
          sccache: "true"
          rust-toolchain: stable
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-freethreaded-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist

  macos:
    name: Python MacOS builds
    needs: [python_checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Setup test environment
        env:
          RUSTC_WRAPPER: ""
        run: |
          uv venv
          uv sync --group dev --no-install-project
          uv pip install --force-reinstall dist/qslib-*.whl
      - name: pytest
        run: just ci-test-python
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          name: python-macos-${{ matrix.target }}
          token: ${{ secrets.CODECOV_TOKEN }}

  macos-freethreaded:
    name: Python MacOS free-threaded builds
    needs: [python_checks]
    runs-on: macos-15
    strategy:
      matrix:
        target: [x86_64, aarch64]
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python3 --no-default-features --features python
          sccache: "true"
          rust-toolchain: stable
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-freethreaded-${{ matrix.python-version }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: [python_checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: PyPI Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, linux-freethreaded, windows, windows-freethreaded, macos, macos-freethreaded, sdist]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  github_release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, linux-freethreaded, windows, windows-freethreaded, macos, macos-freethreaded, sdist]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## Version / {
              if (found) exit
              header=$0; sub(/^## Version /, "", header)
              if (header == ver) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          echo "$NOTES" > /tmp/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            dist/*

  rust_release:
    name: Rust Crates.io Release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rust_checks]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: cargo publish --allow-dirty -p qslib
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  python_tests_real:
    name: Python tests with machine
    runs-on: self-hosted
    env:
      QSLIB_TEST_MACHINE: localhost
      QSLIB_TEST_PORT: "7000"
      QSLIB_TEST_PASSWORD: correctpassword
      QSLIB_TEST_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Setup virtual environment
        run: |
          uv venv -p 3.13
          uv pip install maturin
          uv sync --group dev --no-install-project
      - name: Run pytest with Python + Rust coverage
        run: just coverage-python-full
      - uses: codecov/codecov-action@v5
        with:
          files: coverage-python.xml,coverage-rust-from-python.lcov
          name: python-self-hosted
          token: ${{ secrets.CODECOV_TOKEN }}

  rust_integration_tests:
    name: Rust tests with machine
    runs-on: self-hosted
    env:
      QSLIB_TEST_MACHINE: localhost
      QSLIB_TEST_PORT: "7000"
      QSLIB_TEST_PASSWORD: correctpassword
      QSLIB_TEST_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Run integration tests with coverage
        run: just cov-rust-integration
      - uses: codecov/codecov-action@v5
        with:
          files: coverage-integration.lcov
          name: rust-integration
          token: ${{ secrets.CODECOV_TOKEN }}
