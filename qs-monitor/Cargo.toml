[package]
name = "qs-monitor"
edition = "2024"
version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.95"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
clap = { version = "4.4", features = ["derive"] }
config = "0.15.7"
influxdb2 = { version = "0.5.2", default-features = false, features = ["rustls"] }
log = "0.4.25"
stderrlog = "0.6.0"
tokio = { version = "1.42", features = ["net", "sync", "rt", "io-util", "macros", "rt-multi-thread", "tracing", "signal", "time"] }
tokio-stream = "0.1.11"
chrono = "0.4.39"
futures = "0.3"
env_logger = "0.11"
thiserror = "2.0.11"
matrix-sdk = { version = "0.16.0", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite", "rustls-tls"] }
serde_json = "1.0.138"
dashmap = "6.1.0"
data-encoding = "2.7.0"
lazy_static = "1.5.0"
zip = "2.2.2"
walkdir = "2.5.0"
quick-xml = { version = "0.38", features = ["serialize"] }
qslib = { path = "..", package = "qslib" }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
libc = "0.2"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
