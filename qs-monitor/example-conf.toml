## QS Monitor configuration
## Multiple instrument configuration example

## Global settings
[global]
reconnect_wait_seconds = 10
state_database = "/var/lib/qs-monitor/state.sqlite"
shutdown_drain_seconds = 20


[[machines]]
name = "qpcr1"
host = "qpcr1"
## Optional qslib-server semantic status/SSE mode. Omit this setting for the
## default direct-SCPI subscription mode.
# server_port = 7500
## Bearer token for qslib-server. Omit when its ACL grants an unauthenticated
## role sufficient for monitoring, or when it runs with --no-auth.
# server_token = "replace-me"


[[machines]]
name = "qpcr2"
host = "qpcr2"

[[machines]]
name = "qpcr3"
host = "qpcr3"

[[machines]]
name = "qpcr4"
host = "qpcr4"


## Matrix bot for notification and control
[matrix]
host = "https://matrix.org"
user = "qsbot"
password = "your-secure-password"
rooms = ["!roomid:matrix.org"]
session_file = "/var/lib/qs-monitor/matrix_session.json"
allow_verification = false  # Enable temporarily for session verification
allow_commands = true      # Allow commands to be sent to the bot
allow_control = false      # Allow commands that can control the instruments

# InfluxDB settings for status and log tracking
[influxdb]
url = "http://localhost:8086"
org = "my-org"
bucket = "qpcr-data"
token = "your-token-here"
batch_size = 100  # Optional, defaults to 100
flush_interval_ms = 1000  # Optional, defaults to 1000ms

## Optional stdout logging can be enabled without configuration
# [stdout]
